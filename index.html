<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Veículos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>Sistema de Cadastro de Veículos</h1>
    <p>Cadastro de veículos disponíveis para venda</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Cadastrar Veículo</h2>

      <form id="formVeiculo">
        <div class="grid">
          <div class="campo">
            <label for="placa">Placa</label>
            <input type="text" id="placa" name="placa" required>
          </div>

          <div class="campo">
            <label for="marca">Marca</label>
            <input type="text" id="marca" name="marca" required>
          </div>

          <div class="campo">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" name="modelo" required>
          </div>

          <div class="campo">
            <label for="ano_fabricacao">Ano de Fabricação</label>
            <input type="number" id="ano_fabricacao" name="ano_fabricacao" required>
          </div>

          <div class="campo">
            <label for="ano_modelo">Ano do Modelo</label>
            <input type="number" id="ano_modelo" name="ano_modelo" required>
          </div>

          <div class="campo">
            <label for="cor">Cor</label>
            <input type="text" id="cor" name="cor" required>
          </div>

          <div class="campo">
            <label for="combustivel">Combustível</label>
            <input type="text" id="combustivel" name="combustivel" required>
          </div>

          <div class="campo">
            <label for="quilometragem">Quilometragem</label>
            <input type="number" id="quilometragem" name="quilometragem" required>
          </div>

          <div class="campo">
            <label for="chassi">Chassi</label>
            <input type="text" id="chassi" name="chassi" required>
          </div>

          <div class="campo">
            <label for="renavam">Renavam</label>
            <input type="text" id="renavam" name="renavam" required>
          </div>

          <div class="campo">
            <label for="data_cadastro">Data de Cadastro</label>
            <input type="date" id="data_cadastro" name="data_cadastro" required>
          </div>

          <div class="campo campo-full">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" required></textarea>
          </div>
        </div>

        <button type="submit">Cadastrar Veículo</button>
        <a href="listar.html" class="link-botao">Consultar Veículos</a>
      </form>

      <p id="mensagem"></p>
    </section>
  </main>

  <script src="js/cadastro.js"></script>
</body>
</html>
